<svg width="800" height="1320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card { fill: #FFFFFF; stroke: #2563EB; stroke-width: 2; rx: 12; }
      .card-teacher { fill: #F0FDF4; stroke: #059669; stroke-width: 2; rx: 12; }
      .card-student { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; rx: 12; }
      .title { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; }
      .subtitle { fill: #6B7280; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }
      .arrow { stroke: #2563EB; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-branch { stroke: #059669; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-merge { stroke: #EA580C; stroke-width: 2; fill: none; marker-end: url(#arrowhead-orange); }
      .label { fill: #6B7280; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; }
      .badge { fill: #2563EB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EA580C" />
    </marker>
  </defs>

  <rect class="card" x="190" y="25" width="420" height="70"/>
  <text class="badge" x="215" y="53">01</text>
  <text class="title" x="260" y="53">发现试卷</text>
  <text class="subtitle" x="215" y="78">教师卷与学生卷分组 | 稳定页序</text>
  <path class="arrow" d="M 400 95 L 400 120"/>

  <rect class="card" x="190" y="120" width="420" height="70"/>
  <text class="badge" x="215" y="148">02</text>
  <text class="title" x="260" y="148">图像预处理</text>
  <text class="subtitle" x="215" y="173">归一化 | 透视校正 | 学生页自动配准</text>
  <path class="arrow" d="M 400 190 L 400 215"/>

  <rect class="card-teacher" x="190" y="215" width="420" height="70"/>
  <text class="badge" x="215" y="243">03</text>
  <text class="title" x="260" y="243">题目树生成</text>
  <text class="subtitle" x="215" y="268">VLM 读取预处理原图 | 不读取 OCR | 不输出坐标</text>
  <path class="arrow" d="M 400 285 L 400 310"/>

  <rect class="card" x="190" y="310" width="420" height="70"/>
  <text class="badge" x="215" y="338">04</text>
  <text class="title" x="260" y="338">题目局部定位</text>
  <text class="subtitle" x="215" y="363">按树中页码和题干锚点建立局部搜索上下文</text>
  <path class="arrow" d="M 400 380 L 400 405"/>

  <rect class="card" x="190" y="405" width="420" height="70"/>
  <text class="badge" x="215" y="433">05</text>
  <text class="title" x="260" y="433">槽位语义提议</text>
  <text class="subtitle" x="215" y="458">VLM 判断槽位归属、顺序和粗搜索区域</text>
  <path class="arrow" d="M 400 475 L 400 500"/>

  <rect class="card" x="190" y="500" width="420" height="70"/>
  <text class="badge" x="215" y="528">06</text>
  <text class="title" x="260" y="528">OCR 与 VLM 交叉验证</text>
  <text class="subtitle" x="215" y="553">题号 | 页码 | 阅读顺序 | 选项与小问 | 有界重试</text>
  <path class="arrow" d="M 400 570 L 400 595"/>

  <rect class="card" x="190" y="595" width="420" height="70"/>
  <text class="badge" x="215" y="623">07</text>
  <text class="title" x="260" y="623">OCR 坐标落地</text>
  <text class="subtitle" x="215" y="648">VLM 搜索提示由当前卷 OCR 框确定最终坐标</text>
  <path class="arrow" d="M 400 665 L 400 690"/>

  <rect class="card-student" x="190" y="690" width="420" height="70"/>
  <text class="badge" x="215" y="718">08</text>
  <text class="title" x="260" y="718">答案识别</text>
  <text class="subtitle" x="215" y="743">教师与学生独立转写 | 选择标记与公式专用路径</text>
  <path class="arrow" d="M 400 760 L 400 785"/>

  <rect class="card" x="190" y="785" width="420" height="70"/>
  <text class="badge" x="215" y="813">09</text>
  <text class="title" x="260" y="813">自动修复</text>
  <text class="subtitle" x="215" y="838">按失败类型扩域、重定位、复读 | 重试次数有上限</text>
  <path class="arrow" d="M 400 855 L 400 880"/>

  <rect class="card" x="190" y="880" width="420" height="70"/>
  <text class="badge" x="215" y="908">10</text>
  <text class="title" x="260" y="908">结果输出</text>
  <text class="subtitle" x="215" y="933">JSON | 阶段轨迹 | 错误状态 | 槽位可视化</text>

  <path class="arrow" d="M 400 950 L 400 990"/>
  <rect x="300" y="990" width="200" height="50" rx="8" fill="#2563EB" opacity="0.1" stroke="#2563EB" stroke-width="2"/>
  <text class="title" x="344" y="1021" fill="#2563EB">ExamPackage v5</text>

  <text class="title" x="190" y="1100">坐标权限</text>
  <text class="subtitle" x="190" y="1128">VLM：题目树、槽位语义、粗搜索提示</text>
  <text class="subtitle" x="190" y="1153">OCR：文字框、文字内容与题干锚点证据</text>
  <text class="subtitle" x="190" y="1178">本地图像算法：最终像素坐标与几何状态</text>

  <line x1="190" y1="1230" x2="245" y2="1230" stroke="#2563EB" stroke-width="2"/>
  <text class="label" x="260" y="1235">自动主流程，无需人工调框或修订题目树</text>
</svg>
